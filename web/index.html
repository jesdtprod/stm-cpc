          stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 4" />
        <line x1="316" y1="30" x2="316" y2="390" stroke="#234735"
          stroke-width="1.2" stroke-opacity="0.45" />

      <div class="startup-card">
        <div class="startup-logo">
          <img src="icons/cpc-logo.png" alt="Capitol Pickleball Club" width="64"
            height="64" />
        </div>
        <span class="startup-brand">Capitol Pickleball Club</span>
        <h1>Loading your account</h1>
        <div class="startup-progress" role="progressbar"
          aria-label="Loading your account">
          <span></span>
        </div>
        <p
          class="startup-message">Restoring your session and preparing your workspace.</p>
      </div>
    </section>
    <button type="button" class="skip" id="skip">Skip to content</button>
    <header class="app-header">

        type="button"
        class="menu-btn"
        id="menu-btn"
        aria-label="Open menu"

          <path d="M4 6h16M4 12h16M4 18h16" />

          data-route="/booking">Courts</a>
        <a href="#/events" class="header-nav-link"
          data-route="/events">Events</a>

      <div class="scrim" id="scrim" hidden></div>
      <main id="main" tabindex="-1"></main>

      aria-label="Mobile navigation"></nav>
