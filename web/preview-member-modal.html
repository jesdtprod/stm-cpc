<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Member Details Redesign Preview</title>
  <link rel="stylesheet" href="./buttons.css">
  <link rel="stylesheet" href="./shell.css">
  <link rel="stylesheet" href="./styles.css">
  <style>
    body {
      background: #07130E;
      color: #F5F9F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      align-items: center;
      min-height: 100vh;
    }
    .preview-header {
      text-align: center;
      max-width: 800px;
    }
    .preview-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #F5F9F6;
      margin: 0 0 8px;
    }
    .preview-header p {
      font-size: 14px;
      color: #9EB5A7;
      margin: 0;
    }
    .preview-row {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
    }
    .preview-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .preview-col h2 {
      font-size: 14px;
      font-weight: 700;
      color: #DFB756;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0;
    }

    /* Modal static presentation */
    .static-dialog {
      position: static !important;
      display: block !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 1px solid rgba(223, 183, 86, 0.22) !important;
      border-radius: 20px !important;
      background: linear-gradient(180deg, rgba(16, 38, 28, 0.98) 0%, rgba(10, 24, 17, 0.99) 100%) !important;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.06) inset !important;
      overflow: hidden;
    }
    .static-dialog.desktop {
      width: 800px !important;
      max-width: 800px !important;
    }
    .static-dialog.mobile {
      width: 380px !important;
      max-width: 380px !important;
    }

    /* Unified Membership & Audit Card styles */
    .member-audit-card {
      background: linear-gradient(135deg, rgba(223, 183, 86, 0.04) 0%, rgba(21, 128, 61, 0.08) 100%) !important;
      border: 1px solid rgba(223, 183, 86, 0.22) !important;
      gap: 14px !important;
    }
    .member-status-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: start;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .member-card-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.07);
      margin: 0;
    }

    /* Mobile specific inside .mobile container */
    .static-dialog.mobile .member-status-strip {
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
    }
    .static-dialog.mobile .member-summary-item {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .static-dialog.mobile .member-profile-sections {
      grid-template-columns: minmax(0, 1fr);
    }
  </style>
</head>
<body>
  <div class="preview-header">
    <h1>Member Details Modal — Redesign & Restructure</h1>
    <p>Consolidated into 1 Section Only: <strong>Membership &amp; Audit</strong></p>
  </div>

  <div class="preview-row">
    <div class="preview-col">
      <h2>Desktop View (1 Section for Status &amp; Audit)</h2>
      <div id="target-desktop"></div>
    </div>
    <div class="preview-col">
      <h2>Mobile View (1 Section for Status &amp; Audit)</h2>
      <div id="target-mobile"></div>
    </div>
  </div>

  <script type="module">
    import { h, badge, icon, button, iconButton } from "./ui.js";

    const mockRow = {
      member_no: "CPC-2026-00001",
      status: "active",
      status_reason: "active",
      flags: [],
      deleted_at: null,
      profile_id: "user-123",
      persons: {
        display_name: "Kyle Marquez",
        mobile: "09566997151",
        email: "kyxymiller@gmail.com",
        address_text: "Poblacion III, Lebak, Sultan Kudarat",
        date_of_birth: "1994-11-28",
        gender: "male",
        emergency_name: "Marlon Quinto",
        emergency_relationship: "Team Leader",
        emergency_phone: "09171247192"
      }
    };

    function renderModal(mode) {
      const p = mockRow.persons;
      const kv = (label, value, wide = false) =>
        h("dl", { class: `kv-item${wide ? " kv-item-wide" : ""}` },
          h("dt", { class: "kv-label" }, label),
          h("dd", { class: "kv-val" }, value || "—")
        );

      const historyMock = h("div", { class: "timeline-list" },
        h("div", { class: "timeline-item" },
          h("div", { class: "timeline-node is-success" }),
          h("div", { class: "timeline-content" },
            h("div", { class: "timeline-meta" },
              h("span", { class: "timeline-time" }, "Oct 25, 2026, 11:33 AM"),
              h("span", { class: "timeline-transition" },
                badge("Suspended", "neutral"),
                h("span", { class: "state-arrow" }, "→"),
                badge("Active", "success")
              )
            ),
            h("p", { class: "timeline-reason" }, '“Active”')
          )
        ),
        h("div", { class: "timeline-item" },
          h("div", { class: "timeline-node is-danger" }),
          h("div", { class: "timeline-content" },
            h("div", { class: "timeline-meta" },
              h("span", { class: "timeline-time" }, "Oct 25, 2026, 11:33 AM"),
              h("span", { class: "timeline-transition" },
                badge("Active", "neutral"),
                h("span", { class: "state-arrow" }, "→"),
                badge("Suspended", "danger")
              )
            ),
            h("p", { class: "timeline-reason" }, '“Not Active”')
          )
        )
      );

      const rankElement = h("span", { class: "member-rank-line" },
        badge("Unranked", "neutral"),
        iconButton({
          label: "Set Rank",
          icon: "medal",
          size: "sm",
          variant: "edit"
        })
      );

      // Unified Single Section: Membership & Audit
      const unifiedCard = h("div", { class: "member-section-card member-audit-card" },
        h("h3", {},
          h("span", { class: "section-icon" }, icon("idCard")),
          "Membership & Audit"
        ),
        h("div", { class: "member-status-strip" },
          h("div", { class: "member-summary-item" },
            h("span", { class: "kv-label" }, "Membership"),
            badge("Active", "success")
          ),
          h("div", { class: "member-summary-item" },
            h("span", { class: "kv-label" }, "Account"),
            badge("Active Account", "success")
          ),
          h("div", { class: "member-summary-item" },
            h("span", { class: "kv-label" }, "Club Ranking"),
            rankElement
          )
        ),
        h("div", { class: "member-card-divider" }),
        h("div", { class: "member-details-grid" },
          kv("Reason on Record", "Active"),
          kv("Review Flags", h("span", { class: "muted" }, "None"))
        )
      );

      return h("div", { class: `static-dialog modal modal-lg modal-tone-info ${mode}` },
        h("div", { class: "modal-form" },
          h("div", { class: "modal-head" },
            h("span", { class: "badge-icon is-info" }, icon("user", { solid: true })),
            h("div", { class: "grow" },
              h("div", { class: "eyebrow" }, mockRow.member_no),
              h("h2", {}, p.display_name)
            ),
            h("button", { class: "modal-close-btn", type: "button" }, icon("x"))
          ),
          h("div", { class: "modal-body" },
            h("div", { class: "member-details-modal" },
              unifiedCard,
              h("div", { class: "member-profile-sections" },
                h("div", { class: "member-section-card" },
                  h("h3", {},
                    h("span", { class: "section-icon" }, icon("phone")),
                    "Contact Information"
                  ),
                  h("div", { class: "member-details-grid" },
                    kv("Mobile", h("a", { href: "#", class: "details-link" }, p.mobile)),
                    kv("Email", h("a", { href: "#", class: "details-link" }, p.email)),
                    kv("Address", p.address_text, true)
                  )
                ),
                h("div", { class: "member-section-card" },
                  h("h3", {},
                    h("span", { class: "section-icon" }, icon("user")),
                    "Personal & Profile"
                  ),
                  h("div", { class: "member-details-grid" },
                    kv("Date of Birth", p.date_of_birth),
                    kv("Gender", "Male"),
                    kv("Emergency Contact", `${p.emergency_name} · ${p.emergency_relationship} · ${p.emergency_phone}`, true)
                  )
                )
              ),
              h("div", { class: "member-section-card" },
                h("h3", {},
                  h("span", { class: "section-icon" }, icon("calendar")),
                  "Status & Activity History"
                ),
                historyMock
              )
            )
          ),
          h("div", { class: "modal-foot" },
            h("button", { class: "btn btn-primary" }, "Close")
          )
        )
      );
    }

    document.getElementById("target-desktop").append(renderModal("desktop"));
    document.getElementById("target-mobile").append(renderModal("mobile"));
  </script>
</body>
</html>
